# Formal LoRA-SFT budget for one RX 7900 XT 20 GB.
model_name_or_path: Qwen/Qwen3.5-0.8B-Base
model_revision: a9a407bcae463285164cc9133995c515379cebe5
mixed_precision: bf16
local_files_only: true

train_file: data/processed/train.jsonl
validation_file: data/processed/validation.jsonl
data_report_file: data/processed/data_report.json
max_samples: 3000
validation_max_samples: 768
output_dir: artifacts/checkpoints/sft-main

max_length: 768
max_steps: 300
gradient_accumulation_steps: 16
learning_rate: 2.0e-5
warmup_ratio: 0.05
lr_scheduler_type: cosine
weight_decay: 0.01
max_grad_norm: 1.0
logging_steps: 5
eval_steps: 50
save_steps: 50
save_total_limit: 2

lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
seed: 42
