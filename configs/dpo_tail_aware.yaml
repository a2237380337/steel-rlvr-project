# Frequency-aware DPO: controlled against dpo_baseline.yaml.
model_name_or_path: artifacts/checkpoints/sft-main
model_revision: a9a407bcae463285164cc9133995c515379cebe5
mixed_precision: bf16
local_files_only: true

train_file: data/processed/preferences_train.jsonl
validation_file: data/processed/preferences_validation.jsonl
preference_report_file: data/processed/preference_report.json
max_samples: 3000
validation_max_samples: 768
output_dir: artifacts/checkpoints/dpo-tail-aware

max_length: 896
max_steps: 200
gradient_accumulation_steps: 16
learning_rate: 1.0e-6
warmup_ratio: 0.05
lr_scheduler_type: cosine
weight_decay: 0.01
max_grad_norm: 1.0
beta: 0.1
loss_type: sigmoid
logging_steps: 5
eval_steps: 50
save_steps: 50
save_total_limit: 2

tail_aware_sampling: true
seed: 42
